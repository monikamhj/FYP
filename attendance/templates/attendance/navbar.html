<div class="sidebar">
  <div class="sidebar-header"></div>

  <div class="logo-container">
    <h1 class="sidebar-title">Attendify</h1>
  </div>

  <div class="sidebar-menu">
    <a href="{% url 'dashboard' %}{% if selected_month %}?month={{ selected_month }}&year={{ selected_year }}{% endif %}" class="sidebar-item{% if active_page == 'dashboard' %} active{% endif %}">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      </div>
      <span class="sidebar-label">Home</span>
    </a>
    <a href="{% url 'attendance_report' %}{% if selected_month %}?month={{ selected_month }}&year={{ selected_year }}{% endif %}" class="sidebar-item{% if active_page == 'attendance' %} active{% endif %}">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <path d="m9 16 2 2 4-4"></path>
        </svg>
      </div>
      <span class="sidebar-label">Attendance</span>
    </a>
    <a href="{% url 'course' %}" class="sidebar-item{% if active_page == 'course' %} active{% endif %}">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      </div>
      <span class="sidebar-label">Courses</span>
    </a>
    <a href="{% url 'leave_view' %}" class="sidebar-item{% if active_page == 'leave' %} active{% endif %}">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <span class="sidebar-label">Apply for Leave</span>
    </a>
    <a href="{% url 'leave_history' %}" class="sidebar-item{% if active_page == 'leave_history' %} active{% endif %}">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v5h5"></path>
          <path d="M3.05 13a9 9 0 1 0 .5-4.5L3 8"></path>
          <path d="M12 7v5l4 2"></path>
        </svg>
      </div>
      <span class="sidebar-label">Leave History</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <a href="{% url 'logout' %}" class="sidebar-item">
      <div class="sidebar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </div>
      <span class="sidebar-label">Logout</span>
    </a>
  </div>
</div>
