{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendify - Student Portal</title>
  <meta name="description" content="Student attendance tracking portal" />
  <meta name="author" content="Attendify" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/leave.css' %}">
  <script>
    document.cookie = "csrftoken={{ csrf_token }}";
  </script>
</head>

<body>
  <div class="main-container">
    {% include 'attendance/navbar.html' with active_page='leave' %}

    <!-- Main Content -->
    <div class="main-content">
      <div class="header">
        <h1>Apply for Leave</h1>
        <p>Submit your leave application with supporting details</p>
      </div>

      <div class="content-container">
        <div class="card">
          <div class="card-content">
            <div id="leaveFormAlert" class="form-alert" hidden role="alert"></div>
            <form id="leaveForm">
              <div class="form-group">
                <label>Select Leave Date(s)</label>
                <div class="calendar-container">
                  <div class="calendar-group">
                    <p class="calendar-label">From</p>
                    <div id="fromDatePicker" class="date-picker">
                      <div class="calendar-header">
                        <button type="button" id="prevMonthFrom" class="month-nav">&lt;</button>
                        <div id="currentMonthFrom">April 2025</div>
                        <button type="button" id="nextMonthFrom" class="month-nav">&gt;</button>
                      </div>
                      <div class="weekdays">
                        <span>Su</span>
                        <span>Mo</span>
                        <span>Tu</span>
                        <span>We</span>
                        <span>Th</span>
                        <span>Fr</span>
                        <span>Sa</span>
                      </div>
                      <div id="fromCalendarDays" class="days">
                        <!-- Days will be populated by JavaScript -->
                      </div>
                    </div>
                  </div>

                  <div class="calendar-group">
                    <p class="calendar-label">To (Optional)</p>
                    <div id="toDatePicker" class="date-picker">
                      <div class="calendar-header">
                        <button type="button" id="prevMonthTo" class="month-nav">&lt;</button>
                        <div id="currentMonthTo">April 2025</div>
                        <button type="button" id="nextMonthTo" class="month-nav">&gt;</button>
                      </div>
                      <div class="weekdays">
                        <span>Su</span>
                        <span>Mo</span>
                        <span>Tu</span>
                        <span>We</span>
                        <span>Th</span>
                        <span>Fr</span>
                        <span>Sa</span>
                      </div>
                      <div id="toCalendarDays" class="days">
                        <!-- Days will be populated by JavaScript -->
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label for="category">Leave Category</label>
                <select name="category" id="category" class="form-select" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="illness">Illness</option>
                    <option value="appointment">Appointment</option>
                    <option value="family">Family Matter</option>
                    <option value="other">Other</option>
                </select>
            </div>

              <div class="form-group">
                <label for="reason">Reason for Leave</label>
                <textarea id="reason" placeholder="Please provide a detailed reason for your leave application" required></textarea>
              </div>

              <button type="submit" class="submit-btn">Submit Application</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast">
    <div class="toast-content">
      <div class="toast-title">Title</div>
      <div class="toast-message">Message</div>
    </div>
  </div>

  <script src="{% static 'js/leave.js' %}"></script>
</body>

</html>
